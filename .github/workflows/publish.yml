name: Publish Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build for ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: osx-x64
            archive: zip
          - rid: osx-arm64
            archive: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained false \
          -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false \
          --output ./publish/${{ matrix.rid }}

      - name: Build Archive (zip)
        if: matrix.archive == 'zip'
        run: |
          cd ./publish/${{ matrix.rid }}
          zip -r ../../XivExdUnpacker-${{ matrix.rid }}.zip ./*

      - name: Build Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd ./publish/${{ matrix.rid }}
          tar -czvf ../../XivExdUnpacker-${{ matrix.rid }}.tar.gz ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: XivExdUnpacker-${{ matrix.rid }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
